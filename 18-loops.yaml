- name: install packages
  hosts: local
  connection: local
  become: Yes
  tasks: 
  - name: install package
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.name }}"
  loop: #list of map
  - { name: "mysql", state: "absent"} #map/dictionery
  - { name: "nginx", state: "present"}
  - { name: "zip", state: "present"}